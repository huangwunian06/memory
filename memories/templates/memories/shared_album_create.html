{% extends 'memories/base.html' %}
{% block content %}
<div class="card" style="max-width:500px;margin:0 auto;">
    <h2>➕ 创建共同相册</h2>
    <p style="color:#888;">创建后所有人都可以上传照片到此相册</p>
    <form method="post">
        {% csrf_token %}
        <label>相册名称：</label><input type="text" name="name" required placeholder="如：班级合照、302宿舍"><br><br>
        <label>描述（可选）：</label><textarea name="description" rows="2"></textarea><br><br>
        <button class="btn" type="submit">创建</button>
    </form>
</div>
{% endblock %}
