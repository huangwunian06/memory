{% extends 'memories/base.html' %}
{% block content %}
<div class="card" style="max-width:500px;margin:0 auto;">
    <h2>📤 上传到「{{ album.name }}」</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>选择图片（可多选）：</label>
        <input type="file" name="images" multiple accept="image/*"><br><br>
        <label>选择视频（可多选）：</label>
        <input type="file" name="videos" multiple accept="video/*"><br><br>
        <label>说明：</label><input type="text" name="caption"><br><br>
        <button class="btn" type="submit">上传</button>
    </form>
</div>
{% endblock %}
