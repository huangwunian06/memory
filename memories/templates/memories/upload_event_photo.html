{% extends 'memories/base.html' %}
{% block content %}
<div class="auth-wrapper" style="min-height:70vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);">
  <div class="card" style="width:100%; max-width:450px; backdrop-filter: blur(10px); background: rgba(255,255,255,0.9);">
    <h2 style="text-align:center; color:#667eea;">📤 上传活动照片/视频</h2>
    <p style="text-align:center;">事件：{{ event.title }}</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <label>选择图片（可多选）：</label>
      <input type="file" name="images" multiple accept="image/*"><br><br>
      <label>选择视频（可多选）：</label>
      <input type="file" name="videos" multiple accept="video/*"><br><br>
      <label>说明：</label><input type="text" name="caption"><br><br>
      <button class="btn" type="submit" style="width:100%;">上传</button>
    </form>
  </div>
</div>
{% endblock %}
