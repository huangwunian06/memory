{% extends 'memories/base.html' %}
{% block content %}
<div class="auth-wrapper" style="min-height:80vh; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
  <div class="card" style="width:100%; max-width:400px; backdrop-filter: blur(10px); background: rgba(255,255,255,0.9);">
    <h2 style="text-align:center; color:#667eea;">🔑 重置密码</h2>
    <p style="text-align:center;color:#888;">输入用户名和花名册姓名验证身份</p>
    <form method="post">
      {% csrf_token %}
      <label>用户名：</label><input type="text" name="username" required><br><br>
      <label>花名册中你的姓名：</label><input type="text" name="display_name" required><br><br>
      <label>新密码：</label><input type="password" name="new_password" required><br><br>
      <button class="btn" type="submit" style="width:100%;">重置密码</button>
    </form>
    <p style="text-align:center;margin-top:1rem;"><a href="{% url 'login' %}">← 返回登录</a></p>
  </div>
</div>
{% endblock %}
