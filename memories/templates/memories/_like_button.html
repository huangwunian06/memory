<form method="post" action="{% url 'toggle_like' %}" style="display:inline;">
    {% csrf_token %}
    <input type="hidden" name="model" value="{{ model_name }}">
    <input type="hidden" name="object_id" value="{{ obj_id }}">
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" style="background:none;border:none;cursor:pointer;font-size:{{ size|default:'0.9rem' }};padding:2px 4px;" title="{% if liked %}取消点赞{% else %}点赞{% endif %}">
        {% if liked %}❤️{% else %}🤍{% endif %}
    </button>
    <span style="font-size:{{ size|default:'0.8rem' }};color:#888;">点赞 {{ like_count|default:0 }}</span>
</form>
